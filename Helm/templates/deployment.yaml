# nginx-frontend.yaml

# 1. Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-frontend
  namespace: frontend
  labels:
    app: nginx-frontend
    environment: dev
    managed-by: kubernetes

spec:
  replicas: {{ .Values.deployment.replicas}}

  selector:
    matchLabels:
      app: nginx-frontend

  # Rolling update strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1{{ .Values.deployment.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.deployment.strategy.rollingUpdate.maxUnavailable }}

  template:
    metadata:
      labels:
        app: nginx-frontend
        environment: dev

    spec:
      terminationGracePeriodSeconds: 30

      # Spread Pods across worker nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: nginx-frontend

      # Container specification
      containers:
        - name: nginx

          image: {{ .Values.deployment.imageVersion}}
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # Startup probe
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 30

          # Readiness probe
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3

          # Liveness probe
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # Resource management
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 256Mi


